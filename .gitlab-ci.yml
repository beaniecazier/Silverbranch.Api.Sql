#          </GroupPackageBeanieUtilities>
#        </packageSourceCredentials>
#      </configuration>" > ~/.nuget/NuGet/NuGet.Config
  script:
    - |
      dotnet nuget add \
      source "${CI_API_V4_URL}/groups/$NUGET_GROUP_ID_SILVERBRANCH/-/packages/nuget/index.json" \
      --name GroupPackagesSilverbranchUtilities \
      --username $NUGET_PULL_USER \
      --password $NUGET_AUTH_TOKEN \
      --store-password-in-clear-text
    - dotnet build -c Release
    - |
      dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" \
      --name gitlab \
      --username gitlab-ci-token \
      --password $CI_JOB_TOKEN \
      --store-password-in-clear-text
    - PACKAGE_PATH=$(find . -type f -name "*Gay.Silverbranch.pkg.Api.Sql*.nuget"| head -n 1)
    - echo "Pushing $PACKAGE_PATH"
    - |
      dotnet nuget push $PACKAGE_PATH \
      --source gitlab
    - dotnet nuget remove source GroupPackagesSilverbranchUtilities
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  environment: production