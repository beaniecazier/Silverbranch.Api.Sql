default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - test
  - secret-detection
  - deploy

variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

deploy:
  stage: deploy
#  before_script:
#    - apt-get update && apt-get install -y jq
#    - GROUP_ID=$(curl --header "PRIVATE-TOKEN:$NUGET_AUTH_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID" | jq -r .namespace.id)
#    - echo "Setting up NuGet authentication..."
#    - mkdir -p ~/.nuget/NuGet
#    - echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>
#      <configuration>
#        <packageSources>
#          <add key=\"nuget.org\" value=\"https://api.nuget.org/v3/index.json\" />
#          <add key=\"GroupPackageBeanieUtilities\" value=\"${CI_API_V4_URL}/groups/$GROUP_ID/-/packages/nuget/index.json\" />
#        </packageSources>
#        <packageSourceCredentials>
#          <GroupPackageBeanieUtilities>
#            <add key=\"Username\" value=\"$GITLAB_USER_LOGIN\" />
